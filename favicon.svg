<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  <!-- Fundo escuro estilizado arredondado -->
  <rect width="64" height="64" rx="14" fill="#0f172a" />
  <rect width="60" height="60" x="2" y="2" rx="12" fill="none" stroke="url(#techGrad)" stroke-width="2" opacity="0.6" />
  
  <!-- Linhas de Conexão de Rede Neural / Grafos de Dados -->
  <line x1="18" y1="44" x2="32" y2="28" stroke="#7c3aed" stroke-width="2.5" opacity="0.7" />
  <line x1="32" y1="28" x2="46" y2="18" stroke="#4f46e5" stroke-width="2.5" opacity="0.7" />
  <line x1="18" y1="44" x2="38" y2="44" stroke="#4f46e5" stroke-width="2" opacity="0.5" stroke-dasharray="2,2" />

  <!-- Barras de Gráfico Analítico (Data Analytics) -->
  <rect x="14" y="36" width="8" height="16" rx="2" fill="url(#techGrad)" />
  <rect x="28" y="24" width="8" height="28" rx="2" fill="url(#techGrad)" />
  <rect x="42" y="14" width="8" height="38" rx="2" fill="url(#techGrad)" />

  <!-- Nós de Dados / Insights (Data Science Nodes) -->
  <circle cx="18" cy="36" r="3.5" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5" />
  <circle cx="32" cy="24" r="3.5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
  <circle cx="46" cy="14" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
</svg>
